name: Actualités & Analyses Profondes H24

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch news & market shocks
        run: python scripts/fetch_news.py

      - name: Commit and push updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update deep news & market analysis"
            git pull --rebase origin main || true
            git push
          fi
