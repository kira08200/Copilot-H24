name: Générer APK Android (Copilote-H24.apk)

on:
  push:
    paths:
      - "index.html"
      - "icon-192.png"
      - "icon-512.png"
      - "scripts/build_apk.sh"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and sign Copilote-H24.apk
        run: bash scripts/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copilote-H24-apk
          path: Copilote-H24.apk

      - name: Commit Copilote-H24.apk to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Copilote-H24.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "chore: build Android APK Copilote-H24.apk [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
